[package]
name = "zawra-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85" # Required for Edition 2024
description = "Zawra — a next-generation browser powered by WPE, z-net, and BrowserDB"
license = "MPL-2.0"
autobins = false

[workspace]
members = [
    "tools/setup",
    "dependencies/z-net/engine",
    "dependencies/Browser-db/bindings",
    "fuzz",
]
resolver = "2"

[dependencies]
dashmap = "6.0"
libc    = "0.2"
dirs    = "5.0"   # home_dir() for profile resolution
lean-net = { package = "z-net-engine", path = "dependencies/z-net/engine" }
browserdb = { package = "zawradb", path = "dependencies/Browser-db/bindings" }
ring = "0.17.14"
base64 = "0.23"
serde_json = "1.0"
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "resource-assembler"] }

[lib]
name = "zawra_browser"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "zawra"
path = "src/bin/zawra.rs"


[dev-dependencies]
# No extra deps needed — tests use only the library

[build-dependencies]
# build.rs uses only std
