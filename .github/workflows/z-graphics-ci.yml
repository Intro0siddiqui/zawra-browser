name: Z-Graphics CI
on:
  push:
    paths:
      - 'dependencies/z-graphics/**'
      - '.github/workflows/z-graphics-ci.yml'
  pull_request:
    paths:
      - 'dependencies/z-graphics/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig and Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zig libvulkan-dev vulkan-tools pkg-config
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install zig
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install zig
          fi
      - name: Build Library
        run: cd dependencies/z-graphics && zig build
